name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: ./gradlew build benchClasses
      - run: ./tools/test-allocation-summary.sh
      - run: ./gradlew semanticSoak
        if: runner.os == 'Linux'
      - run: ./gradlew run --args='examples/fib.za'
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: test-results-${{ runner.os }}
          path: |
            build/reports/tests/
            build/test-results/
